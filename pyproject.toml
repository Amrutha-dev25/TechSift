[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "technology-reaction-intelligence"
version = "0.1.0"
description = "Phase 1 ingestion pipeline for technology reaction intelligence."
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.11",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:feedparser.*",
]